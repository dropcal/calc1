<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Calculator</title>
    <style>
        /* Import a nice font from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        /* Basic setup for the body */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* A nice, subtle background image from Unsplash */
            background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-position: center;
        }

        /* The main calculator container with the glass effect */
        .calculator {
            background: rgba(255, 255, 255, 0.1); /* Semi-transparent white */
            backdrop-filter: blur(15px); /* This creates the frosted glass effect */
            -webkit-backdrop-filter: blur(15px); /* For Safari compatibility */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 350px;
            text-align: center;
        }

        /* Styling for the input fields */
        input {
            width: calc(100% - 30px); /* Full width minus padding */
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            outline: none; /* Removes the default blue outline on focus */
            font-family: 'Poppins', sans-serif;
        }

        /* Styling for the placeholder text */
        input::placeholder {
            color: #777;
        }

        /* A container to hold the buttons */
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        /* Styling for the operator buttons */
        button {
            width: 70px;
            height: 70px;
            border-radius: 50%; /* Makes buttons circular */
            border: none;
            background: #ff7f50; /* A vibrant coral color */
            color: white;
            font-size: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Hover effect for buttons */
        button:hover {
            background-color: #ff6347; /* A slightly darker tomato color */
            transform: scale(1.05); /* Makes the button slightly larger on hover */
        }

        /* Active effect for when a button is clicked */
        button:active {
            transform: scale(0.95);
        }

        /* Styling for the answer display area */
        #showAnswer {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.8rem;
            font-weight: 600;
            min-height: 2.5rem; /* Prevents the layout from shifting when the answer appears */
            display: flex;
            justify-content: center;
            align-items: center;
            word-break: break-all; /* Ensures long numbers don't overflow */
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input id="num1" type="text" placeholder="First Number">
        <input id="num2" type="text" placeholder="Second Number">
        <div class="buttons">
            <button onclick="sum()">+</button>
            <button onclick="difference()">-</button>
            <button onclick="quotient()">/</button>
            <button onclick="multiply()">*</button>
        </div>
        <p id="showAnswer">Answer will be displayed here</p>
    </div>

<script>
    // Your JavaScript code remains the same, as it works perfectly!
    const num1 = document.getElementById('num1');
    const num2 = document.getElementById('num2');
    const showAnswer = document.getElementById('showAnswer');

    const sum = () => {
        const answer = Number(num1.value) + Number(num2.value);
        showAnswer.innerHTML = answer;
    }

    const difference = () => {
        const answer = Number(num1.value) - Number(num2.value);
        showAnswer.innerHTML = answer;
    }

    const quotient = () => {
        const answer = Number(num1.value) / Number(num2.value);
        showAnswer.innerHTML = answer;
    }

    const multiply = () => {
        const answer = Number(num1.value) * Number(num2.value);
        showAnswer.innerHTML = answer;
    }
</script>
</body>
</html>
